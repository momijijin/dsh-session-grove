name: Release

# Tag-only release. Normal branch pushes do not publish anything.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24.x'

      - name: Require a version tag
        run: |
          case "$GITHUB_REF_NAME" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *)
              echo "::error::Release only accepts version tags like v1.2.3 or v1.2.3-beta.1; got $GITHUB_REF_NAME"
              exit 1
              ;;
          esac

      - name: Require the tag commit on main
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor HEAD refs/remotes/origin/main
          echo "tag commit is reachable from main"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify release
        run: |
          npm test
          npm run build
          node --check lib/client.js
          npm run check:coverage
          npm run check:release
          npm pack --dry-run

      - name: Pack asset and checksum
        id: pack
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TGZ="dsh-session-grove-${VERSION}.tgz"
          npm pack
          test -f "$TGZ"
          sha256sum "$TGZ" > SHA256SUMS
          cat SHA256SUMS
          echo "tgz=$TGZ" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TGZ: ${{ steps.pack.outputs.tgz }}
        run: |
          NOTES_FILE="docs/release-notes/${GITHUB_REF_NAME}.md"
          test -f "$NOTES_FILE"
          test -f "$TGZ"
          test -f SHA256SUMS

          # Only prerelease tags (e.g. v1.2.3-beta.4) get the prerelease flag.
          PRERELEASE_ARGS=()
          case "$GITHUB_REF_NAME" in
            *-*) PRERELEASE_ARGS+=(--prerelease) ;;
          esac

          cat SHA256SUMS
          gh release create "$GITHUB_REF_NAME" \
            "$TGZ" \
            SHA256SUMS \
            --title "dsh-session-grove ${GITHUB_REF_NAME#v}" \
            --notes-file "$NOTES_FILE" \
            "${PRERELEASE_ARGS[@]}"
