name: CI

# Checks only. This workflow never publishes, tags, bumps a version, or edits the repo.
# Start with the dev branch; release tags have their own workflow.

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Node 24 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24.x'

      # This plugin's tests import @deepseek-ai/schemastery, so unlike the
      # zero-dependency reference plugin, dependencies must be installed.
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Syntax check
        run: |
          node --check src/index.js
          node --check lib/client.js

      - name: Unit and contract tests
        run: npm test

      - name: Build client bundle
        run: npm run build

      - name: Coverage gate
        if: matrix.os == 'ubuntu-24.04'
        run: npm run check:coverage

      - name: Package dry-run
        run: npm pack --dry-run
