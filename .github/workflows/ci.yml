name: CI

# Checks only. This workflow never publishes, tags, bumps a version, or edits the repo.
# Start with the dev branch; release tags have their own workflow.

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Node 24 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24.x'

      # This plugin's tests import @deepseek-ai/schemastery, so unlike the
      # zero-dependency reference plugin, dependencies must be installed.
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Runtime dependencies are audited explicitly: `npm ci` keeps
      # `--no-audit` above so install stays offline-friendly and the audit is a
      # visible, separate gate (high/critical only). Dev dependencies are out of
      # scope because they never ship with the plugin bundle.
      - name: Production dependency audit
        if: matrix.os == 'ubuntu-24.04'
        run: npm audit --omit=dev --audit-level=high

      - name: Style check
        run: npm run check:style

      - name: Syntax check
        run: |
          node --check src/index.js
          node --check lib/client.js

      - name: Unit and contract tests
        run: npm test

      - name: Build client bundle
        run: npm run build

      - name: lib freshness
        run: npm run check:lib

      - name: UI runtime smoke
        run: npm run check:ui

      - name: Coverage gate
        if: matrix.os == 'ubuntu-24.04'
        run: npm run check:coverage

      - name: Package dry-run
        run: npm pack --dry-run
