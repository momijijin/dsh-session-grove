name: CI

# Checks only. This workflow never publishes, tags, bumps a version, or edits the repo.
# Start with the dev branch only; add main/platforms after dev is consistently green.

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      # This plugin's tests import @deepseek-ai/schemastery, so unlike the
      # zero-dependency reference plugin, dependencies must be installed.
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Syntax check
        run: |
          node --check src/index.js
          node --check lib/client.js

      - name: Unit and contract tests
        run: npm test

      - name: Build client bundle
        run: npm run build

      - name: Coverage gate
        run: npm run check:coverage

      - name: Package dry-run
        run: npm pack --dry-run
